[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "textile-defect-detection"
version = "0.1.0"
description = "Image-level textile defect classification baseline (PyTorch ResNet-18) with a local Streamlit inspection app."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vipin T K" }]
dependencies = [
    "numpy>=1.26,<3",
    "pillow>=10.3,<13",
    "pyyaml>=6.0,<7",
    "scikit-learn>=1.4,<2",
    "torch>=2.2,<3",
    "torchvision>=0.17,<1",
    "streamlit>=1.35,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]
